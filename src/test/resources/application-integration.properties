spring.liquibase.contexts=integration

spring.jpa.properties.hibernate.search.backend.directory.type=local-heap

# workflows
workflow.input.active = false
# needs to be activated per test
workflow.automated-action = false

# start postgres test container
context.initializer.classes=de.partspicker.web.test.config.PostgresInitializer

# security - never contacted, security filters are disabled in controller tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/integration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/realms/integration/protocol/openid-connect/certs
