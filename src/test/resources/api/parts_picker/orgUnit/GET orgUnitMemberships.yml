info:
  name: GET orgUnitMemberships
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/org-unit-memberships"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("org_unit_id", res.body._embedded.orgUnitMemberships[0]._links.self.href.split("/").pop());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
