info:
  name: GET orgUnits
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/org-units"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("org_unit_id", res.body._embedded.orgUnits[0]._links.self.href.split("/").pop());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
